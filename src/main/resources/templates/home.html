<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragment/head.html"></head>
<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img src="images/hero-bg.jpg" alt="">
    </div>
    <header th:replace="fragment/header.html"></header>
  </div>

  <!-- about section -->

  <section class="about_section layout_padding">
    <div class="container">
      <hr color="red">
      <div class="posts" th:each="post : ${posts}">
        <h3>
          <a th:href="@{'/post/' + ${post.getId}}" th:text="${post.getTitle}">Title</a>
        </h3>
        <h5 th:text="'Author : ' + ${post.getAccount.getFirstName} + ' | Created At : ' + ${post.createdAt}"></h5>
        <p th:text="${post.body}">Body</p>
        <hr color="red">
      </div>
    </div>
  </section>

  <!-- end about section -->

  <footer th:replace="fragment/footer.html"></footer>

  <!-- JS -->
  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
  <script src="https://unpkg.com/isotope-layout@3.0.4/dist/isotope.pkgd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/js/jquery.nice-select.min.js"></script>
  <script src="js/custom.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh39n5U-4IoWpsVGUHWdqB6puEkhRLdmI&callback=myMap"></script>

</body>
</html>
