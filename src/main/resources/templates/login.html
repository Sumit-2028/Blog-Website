<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragment/head.html">
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hero_area .bg-box img {
      opacity: 0.2;
      filter: grayscale(50%) brightness(50%);
    }

    .card {
      background: #1e1e1e;
      color: #ffffff;
      border: 1px solid #2e2e2e;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .card h2 {
      color: #90caf9;
      font-weight: bold;
      font-size: 28px;
    }

    .form-label {
      color: #cfcfcf;
    }

    .form-control {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
    }

    .form-control:focus {
      border-color: #90caf9;
      box-shadow: 0 0 0 0.2rem rgba(144, 202, 249, 0.25);
      background-color: #2a2a2a;
      color: #fff;
    }

    .btn-primary {
      background-color: #1976d2;
      border: none;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #1565c0;
    }

    footer {
      background-color: #1a1a1a;
      color: #999;
    }

    .about_section {
      padding: 50px 0;
      background: #121212;
    }

    ::placeholder {
      color: #aaaaaa;
    }

    .rounded-pill {
      border-radius: 50rem !important;
    }
  </style>
</head>

<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img src="images/hero-bg.jpg" alt="">
    </div>
    <header th:replace="fragment/header.html"></header>
  </div>

  <!-- about section -->
  <section class="about_section layout_padding">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-lg border-0 rounded-4 p-4 mt-4">
            <h2 class="text-center mb-4">Create Your Account</h2>
            <form action="#" th:action="@{/login}" method="post">

              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="email" class="form-control" id="username" name="username" placeholder="example@gmail.com" required>
              </div>
            
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
              </div>
            
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Login</button>
              </div>
            
            </form>
            
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- end about section -->

  <footer th:replace="fragment/footer.html"></footer>

  <!-- jQery -->
  <script src="js/jquery-3.4.1.min.js"></script>
  <!-- popper js -->
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <!-- bootstrap js -->
  <script src="js/bootstrap.js"></script>
  <!-- owl slider -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
  <!-- isotope js -->
  <script src="https://unpkg.com/isotope-layout@3.0.4/dist/isotope.pkgd.min.js"></script>
  <!-- nice select -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/js/jquery.nice-select.min.js"></script>
  <!-- custom js -->
  <script src="js/custom.js"></script>
  <!-- Google Map -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh39n5U-4IoWpsVGUHWdqB6puEkhRLdmI&callback=myMap"></script>
  <!-- End Google Map -->

</body>

</html>
