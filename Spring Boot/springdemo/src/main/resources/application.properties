# Server Port
server.port=8088

# =======================
# H2 Database Configuration
# =======================
spring.datasource.url=jdbc:h2:./db/blogdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/db-console
spring.h2.console.settings.web-allow-others=false

# Hibernate DDL Auto (create-drop for dev only; use update for prod)
spring.jpa.hibernate.ddl-auto=create-drop

# Enable Lazy Loading
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# =======================
# Thymeleaf (Optional versions — not required here)
# =======================
thymeleaf.version=3.0.12.RELEASE
thymeleaf-layout-dialect.version=2.5.0

# =======================
# Mail Configuration for Gmail SMTP
# =======================
spring.mail.username=your UserName 
spring.mail.password= your password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =======================
# App-specific settings
# =======================
password.token.reset.timeout.minutes=120
site.domain = http://localhost:8088/


spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
