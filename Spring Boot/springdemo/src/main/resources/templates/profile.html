<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head :: head}"></head>
<style>
  body {
    background-color: #fdfcfb; /* softer light tone */
    font-family: 'Segoe UI', sans-serif;
  }

  .card-profile {
    max-width: 600px;
    background-color: #fffdfd; /* light card */
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* subtler shadow */
    margin: 0 auto;
    transition: transform 0.3s ease;
  }

  .card-profile:hover {
    transform: translateY(-5px);
  }

  .card-body {
    padding: 40px;
    text-align: center;
  }

  .card-title {
    font-family: 'Brush Script MT', cursive;
    font-size: 2rem;
    color: #d35400; /* warm but soft title color */
  }

  .card-text {
    font-size: 16px;
    color: #2d3436; /* deeper gray for readability */
    margin-bottom: 10px;
  }

  .hero_area {
  background-color: #fdfcfb !important; /* match the body background */
}


  .btn-update {
    background-color: #f39c12;
    border: none;
    color: white;
    border-radius: 25px;
    padding: 12px 28px;
    font-size: 16px;
    transition: background-color 0.2s ease-in-out;
    text-decoration: none;
    display: inline-block;
  }

  .btn-update:hover {
    background-color: #e67e22;
    color: white;
  }

  .rounded-circle {
    border: 4px solid #fef3ec;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
  }

  h2.section-title {
    font-family: 'Brush Script MT', cursive;
    text-align: center;
    font-size: 2.5rem;
    color: #3d3d3d;
    margin-bottom: 40px;
  }
</style>

<body class="sub_page">
  <!-- Header -->
  <div class="hero_area">
    <!-- <div class="bg-box">
      <img th:src="@{/images/hero-bg.jpg}" alt="Hero Background">
    </div> -->
    <header th:replace="~{fragment/header :: header}"></header>
  </div>

  <!-- Profile Section -->
  <section class="about_section layout_padding">
    <div class="container">
      <h2 class="section-title">My Profile</h2>

      <div class="card card-profile">
        <div class="card-body">
          <!-- Dynamic Profile Image -->
          <img th:src="${account.profileImage != null ? '/uploads/' + account.profileImage : '/images/default-profile.png'}"
               class="rounded-circle mb-4"
               width="120"
               height="120"
               alt="Profile Picture" />

          <!-- User Info -->
          <h4 class="card-title" th:text="${account.firstName + ' ' + account.lastName}">Full Name</h4>
          <p class="card-text"><strong>Email:</strong> <span th:text="${account.email}">email@example.com</span></p>
          <p class="card-text"><strong>Gender:</strong> <span th:text="${account.gender}">Gender</span></p>
          <p class="card-text"><strong>Age:</strong> <span th:text="${account.age}">0</span></p>
          <p class="card-text"><strong>Date of Birth:</strong> 
            <span th:text="${#temporals.format(account.dateOfBirth, 'dd MMM yyyy')}">01 Jan 2000</span>
          </p>
          <p class="card-text"><strong>Role:</strong> <span th:text="${account.role}">Role</span></p>

          <a th:href="@{/profile/update}" class="btn-update mt-4">✏️ Update Profile</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer th:replace="~{fragment/footer :: footer}"></footer>

  <!-- Scripts -->
  <script th:src="@{/js/jquery-3.4.1.min.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script th:src="@{/js/bootstrap.js}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
  <script src="https://unpkg.com/isotope-layout@3.0.4/dist/isotope.pkgd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/js/jquery.nice-select.min.js"></script>
  <script th:src="@{/js/custom.js}"></script>
</body>
</html>
