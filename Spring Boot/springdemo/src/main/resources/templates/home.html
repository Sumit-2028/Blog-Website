<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragment/head :: head}"></head>
    <style>
      body {
        background: linear-gradient(120deg, #f8ede3, #fde2e4);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .heading_container h2 {
        margin-top: 50px;
        margin-bottom: 10px;
        font-weight: 800;
        font-size: 40px;
        color: #333;
      }

      .card {
        background: #fff0f6;
        border: none;
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }

      .card-img-top {
        border-radius: 15px;
        height: 200px;
        object-fit: cover;
        margin-bottom: 15px;
      }

      .btn-read {
        background-color: #ff7f50;
        color: white;
        border-radius: 20px;
        padding: 8px 25px;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 13px;
        border: none;
        transition: background-color 0.3s ease;
      }

      .btn-read:hover {
        background-color: #e06650;
      }

      .blog_date {
        color: #6c757d;
        font-size: 14px;
        margin-bottom: 12px;
      }

      .card-title {
        font-size: 22px;
        font-weight: 700;
        color: #333;
      }

      .card-text {
        font-size: 15px;
        color: #555;
        margin-bottom: 15px;
        min-height: 60px;
      }

      .row {
        margin-top: 40px;
      }

      .blog_section {
        padding: 40px 0 80px;
      }
    </style>
  </head>

  <body class="sub_page">
    <div class="hero_area">
      <div class="bg-box">
        <img src="images/hero-bg.jpg" alt="Background" />
      </div>
      <header th:replace="~{fragment/header :: header}"></header>
    </div>
    <!-- Blog Section -->

    <div th:unless="${isAuthenticated}">
    <form action="/home" method="get">
        <div th:if="${#authorization.expression('isAuthenticated()')}">
          <form action="/" method="get">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
              <span class="navbar-brand">Sort by: </span>
              <ul class="navbar-nav">
                <li class="nav-item active" style="padding-right: 20px;">
                  <div class="dropdown">
                    <select class="form-select" aria-label="Default select example" name="sort_by">
                      <option value="createdAt">Created date</option>
                      <option value="updatedAt">Updated date</option>
                    </select>
                  </div>
                </li>
              </ul>
        
              <span class="navbar-brand">Per page: </span>
              <ul class="navbar-nav">
                <li class="nav-item active" style="padding-right: 20px;">
                  <div class="dropdown">
                    <select class="form-select" aria-label="Default select example" name="per_page">
                      <option selected value="2">2</option>
                      <option value="5">5</option>
                      <option value="10">10</option>
                      <option value="15">15</option>
                    </select>
                  </div>
                </li>
        
                <li class="nav-item active" style="padding-left: 20px;">
                  <div class="input-group-prepend">
                    <button class="btn btn-primary" type="submit" id="dropdownMenuButton">
                      Apply filter(s)
                    </button>
                  </div>
                </li>
              </ul>
            </nav>
          </form>
        </div>
    </form>
  </div>
    <section class="blog_section layout_padding">
      <div class="container">
        <div class="heading_container">
          <h2 style="padding: 10px;">Blog Posts</h2>
        </div>

        <!-- IF user is authenticated -->
        <div class="row justify-content-center" th:if="${isAuthenticated}">
          
          <div class="col-md-6 col-lg-4 d-flex" th:each="post : ${posts}">
            <div class="card flex-fill">
              <img th:if="${post.image != null}" 
                th:src="@{${post.image}}" 
                alt="Post image" 
                class="img-fluid" />

              <div class="card-body text-center">
                <h5 class="card-title" th:text="${post.title}">Post Title</h5>
                <p
                  class="card-text"
                  th:text="${#strings.abbreviate(post.body, 70)}"
                >
                  Sample summary text...
                </p>
                <div
                  class="blog_date"
                  th:text="${#temporals.format(post.createdAt, 'EEE MMM dd yyyy')}"
                ></div>
                <a th:href="@{'/post/' + ${post.id}}" class="btn btn-read"
                  >Read More</a
                >
              </div>
            </div>
          </div>
        </div>

        <!-- IF user is NOT authenticated -->
<div class="row justify-content-center" th:unless="${isAuthenticated}">
  <div class="col-lg-8 text-center mt-5">
    <div
      class="p-5 rounded shadow-sm"
      style="background: #fff5f8; border: 2px dashed #ff7f50;"
    >
    <img
    src="images/lock-blog.jpg"
    alt="Locked Content"
    class="img-fluid mb-4 rounded" 
    style="max-height: 220px"
  />
  
      <h3 style="font-weight: 700; color: #ff7f50;">
        Access Restricted
      </h3>
      <p class="mt-3 mb-4" style="color: #444; font-size: 16px;">
        Sorry, you need to be <strong>logged in</strong> to view the blog content.
        Join our community and explore amazing posts!
      </p>
      <a
        th:href="@{/login}"
        class="btn"
        style="
          background-color: #ff7f50;
          color: white;
          padding: 10px 30px;
          font-weight: bold;
          border-radius: 25px;
          text-transform: uppercase;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
          transition: background-color 0.3s ease;
        "
        onmouseover="this.style.backgroundColor='#e06650'"
        onmouseout="this.style.backgroundColor='#ff7f50'"
      >
        🔐 Login Now
      </a>
    </div>
  </div>
</div>

      </div>
    </section>

    <footer th:replace="~{fragment/footer :: footer}"></footer>

    <!-- Scripts -->
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://unpkg.com/isotope-layout@3.0.4/dist/isotope.pkgd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/js/jquery.nice-select.min.js"></script>
    <script src="js/custom.js"></script>
  </body>
</html>
