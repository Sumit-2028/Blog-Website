<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/head :: head}"></head>

<body class="sub_page">
<div class="hero_area">
  <div class="bg-box">
    <img th:src="@{/images/hero-bg.jpg}" alt="Hero Background" />
  </div>
  <header th:replace="~{fragment/header :: header}"></header>
</div>

<!-- Back Button -->
<button onclick="history.back()" class="btn btn-outline-primary"
        style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
  ← Back
</button>

<section class="about_section layout_padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 p-4 mt-4">
          <h2 class="text-center mb-4" style="color: #90caf9;">Forgot Password</h2>

         <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>

          <form th:action="@{/reset-password}" method="post" th:object="${account}">
            <div class="mb-3">
              <label for="email" class="form-label">Enter your registered email</label>
              <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter email" required>
              <!-- <p class="text-danger mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p> -->
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg rounded-pill">Send Reset Link</button>   
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>

<footer th:replace="~{fragment/footer :: footer}"></footer>
</body>
</html>
