<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" th:href="@{/images/favicon.png}" type="image/png">
  <title>InkVerse</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/bootstrap.css}" />
  <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body style="font-family: 'Inter', sans-serif;">

<!-- Background + Header Section -->
  <header class="header_section" style="background-color: #1e1e2f; position: relative;">
    <div class="container position-relative">
      <nav class="navbar navbar-expand-lg navbar-dark px-2">
        
        <!-- Brand -->
        <a class="navbar-brand fw-bold fs-4" href="/" style="color: #ff7f50; font-weight: 800;">
          Ink<span style="color: #ffffff;">Verse</span>
        </a>
  
        <!-- Toggler for Mobile View -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
  
        <!-- Navigation Items -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
          <ul class="navbar-nav">

            <!-- Only for NOT authenticated users -->
            <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" th:href="@{/register}">Register</a></li>
            <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" th:href="@{/login}">Login</a></li>

            <!-- Only for authenticated users -->
            <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/home}">Home</a></li>
            <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/profile}">Profile</a></li>
            <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/AddPost}">Add Post</a></li>
            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')"><a class="nav-link" th:href="@{/admin}">Admin</a></li>
            <li class="nav-item" sec:authorize="hasAuthority('ACCESS_ADMIN_PANEL')"><a class="nav-link" th:href="@{/admin}">Admin Panel</a></li>
            <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_EDITOR')"><a class="nav-link" th:href="@{/editor}">Editor</a></li>

            <!-- Logout (only for authenticated users) -->
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <form th:action="@{/logout}" method="post" class="form-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="nav-link" style="border: none; background: none; padding: 9px; color: rgb(39, 75, 240);">
                  Logout
                </button>
              </form>
            </li>

          </ul>
        </div>
      </nav>
    </div>
  </header>
<!-- END HEADER -->
