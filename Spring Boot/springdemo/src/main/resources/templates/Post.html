<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragment/head :: head}"></head>
  <style>
    body {
      background-color: #fcefe9;
      font-family: 'Segoe UI', sans-serif;
    }
  
    .section-title {
      font-family: 'Brush Script MT', cursive;
      font-size: 2.5rem;
      margin: 30px 0;
      text-align: center;
      color: #2b2b2b;
    }
  
    .card-custom {
      background-color: #fef5f8;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
  
    .card-custom:hover {
      transform: translateY(-5px);
    }
  
    .post-img {
      max-height: 220px;
      object-fit: cover;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }
  
    .container-posts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }
  </style>
  

  <body class="sub_page">
    <!-- Background + Header Section -->
    <div class="hero_area">
      <div class="bg-box">
        <img th:src="@{/images/hero-bg.jpg}" alt="Hero Background" />
      </div>
      <header th:replace="~{fragment/header :: header}"></header>
    </div>

    <!-- ✅ Back Button (Top-Right) -->
    <button
      onclick="history.back()"
      class="btn btn-outline-primary"
      style="position: fixed; top: 20px; right: 20px; z-index: 1000"
    >
      ← Back
    </button>

    <!-- Modal for Delete Confirmation -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Danger...</h5>
            <button
              type="button"
              class="close"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">Are You Sure Do You Want to Delete this Post??</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              Close
            </button>
            <a
              th:href="@{'/post/' + ${post.id} + '/delete'}"
              class="btn btn-danger"
              role="button"
              aria-pressed="true"
            >
              Delete
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Blog Post Display Section -->
    <!-- Blog Post Display Section -->
<section style="background-color: #fcefe9; padding: 60px 0;">
  <div
    class="container card-custom"
    style="
      padding: 50px;
      background-color: #fef5f8;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 800px;
    "
  >
    <!-- Post Title -->
    <h2
      th:text="${post.title}"
      style="color: #2c3e50; font-weight: 700; margin-bottom: 20px; text-align: center;"
    >
      Title
    </h2>

    <!-- Post Image -->
    <div th:if="${post.image != null}" style="text-align: center; margin-bottom: 30px;">
      <img
        th:src="@{${post.image}}"
        alt="Post Image"
        class="img-fluid"
        style="max-height: 320px; border-radius: 20px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);"
      />
    </div>

    <!-- Author and Date Info -->
    <h5
      th:text="'Author : ' + ${post.account.firstName} + ' | Created At : ' + ${post.createdAt}"
      style="color: #7f8c8d; margin-bottom: 30px; text-align: center;"
    ></h5>

    <!-- Blog Body -->
    <div
      th:utext="${post.body}"
      style="
        color: #212529;
        font-size: 18px;
        line-height: 1.8;
        word-wrap: break-word;
        padding-bottom: 20px;
      "
    ></div>

    <!-- Divider -->
    <hr color="red" style="margin: 30px 0;" />

    <!-- Edit & Delete Buttons -->
    <div th:if="${isAuthor}" class="text-center mt-4">
      <a
        th:href="@{'/post/' + ${post.id} + '/edit'}"
        class="btn btn-outline-secondary btn-lg me-3"
        role="button"
      >
        ✏️ Edit
      </a>

      <button
        type="button"
        class="btn btn-outline-danger btn-lg"
        data-toggle="modal"
        data-target="#exampleModal"
      >
        🗑 Delete
      </button>
    </div>
  </div>
</section>


    <!-- Footer -->
    <footer th:replace="~{fragment/footer :: footer}"></footer>

    <!-- JavaScript Libraries -->
    <script th:src="@{/js/jquery-3.4.1.min.js}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script th:src="@{/js/bootstrap.js}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://unpkg.com/isotope-layout@3.0.4/dist/isotope.pkgd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/js/jquery.nice-select.min.js"></script>
    <script th:src="@{/js/custom.js}"></script>

    <!-- Optional: Google Map Integration -->
    <script>
      function myMap() {
        const mapProp = {
          center: new google.maps.LatLng(51.508742, -0.12085),
          zoom: 5,
        };
        const map = new google.maps.Map(
          document.getElementById("googleMap"),
          mapProp
        );
      }
    </script>

    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh39n5U-4IoWpsVGUHWdqB6puEkhRLdmI&callback=myMap"
    ></script>
  </body>
</html>
